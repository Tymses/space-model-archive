name: Discover asteroid dimensions

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum numbered asteroids to query (blank = all missing)"
        required: false
        default: ""
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: dimension-candidate-scan
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        working-directory: tools/dimensions
        run: python -m unittest -v

      - name: Query JPL SBDB and build candidates
        env:
          SCAN_LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$SCAN_LIMIT" ]; then
            python tools/dimensions/scan_asteroids.py --limit "$SCAN_LIMIT"
          else
            python tools/dimensions/scan_asteroids.py
          fi

      - name: Commit candidate report (verified data is never changed)
        run: |
          if git diff --quiet -- data/real-world-dimension-candidates.json; then
            echo "No candidate report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real-world-dimension-candidates.json
          git commit -m "Update automated asteroid dimension candidates"
          git push
