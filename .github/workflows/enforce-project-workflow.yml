name: Enforce project workflow

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    name: Enforce project workflow
    runs-on: ubuntu-latest
    steps:
      - name: Require the process attestation
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const required = [
              "Ich habe das aktuelle \`PROJECT_HANDBOOK.md\` vor dieser Projektarbeit vollständig gelesen.",
              "Ich habe alle zugänglichen relevanten Dokumentationsspeicherorte einschließlich des BOGY-Projekttagebuchs gesucht und gelesen; nicht zugängliche Orte sind ausdrücklich dokumentiert.",
              "Ich habe den tatsächlichen GitHub-\`main\`-Stand, relevante Backups und Feature-Branches geprüft und vor der Änderung einen neuen Backup-Branch vom inspizierten \`main\` angelegt.",
              "Ich habe \`PROJECT_HANDBOOK.md\` und alle zugänglichen relevanten Dokumentationsorte nach der Änderung aktualisiert und verifiziert; nicht aktualisierbare Orte sind ausdrücklich dokumentiert.",
              "Ich habe die relevanten Tests und den Enddiff ausgeführt bzw. nicht ausgeführte Prüfungen mit Grund dokumentiert."
            ];
            const missing = required.filter(item => !body.includes(`- [x] ${item}`));
            if (missing.length) {
              core.setFailed("Complete every mandatory checkbox in the pull-request template before this PR can pass.");
            }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require handbook update in the same PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -Fxq "PROJECT_HANDBOOK.md"; then
            echo "::error::Every project PR must update PROJECT_HANDBOOK.md with the completed pre-flight/post-flight record."
            exit 1
          fi
